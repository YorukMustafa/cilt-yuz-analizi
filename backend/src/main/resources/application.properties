# ====================================================
# Sunucu ve Port Ayarları
# ====================================================
server.port=8080
server.servlet.context-path=/

# ====================================================
# Python Yapay Zeka Mikroservis Bağlantı URL'si
# ====================================================
ai.service.url=http://localhost:8000

# ====================================================
# Dosya Yükleme Boyut Sınırları (Fotoğraflar için)
# ====================================================
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# ====================================================
# H2 Gömülü Veritabanı ve JPA Ayarları
# ====================================================
spring.datasource.url=jdbc:h2:mem:dermaidb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Web Konsolu (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# Hibernate ve JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
